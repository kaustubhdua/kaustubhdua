name: Profile README QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate README, links, and animated assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          readme = Path("README.md").read_text(encoding="utf-8")
          checks = {
              "ECM identity": "electronics & computer engineering" in readme.lower(),
              "exact original banner URL": "d2ol7oe51mr4n9.cloudfront.net/user_3JuNbn6G1fWehaUubucloQMU8cb/e0930052-b661-4682-a281-67b390d8146e.png" in readme,
              "featured projects": all(name in readme for name in ("GitGlobe", "NIRDHOOM", "Saathi", "SATARK", "Adapt AI")),
              "all six redesigned headings referenced": all(f"assets/headings/{name}.svg?v=20261009-text-reveal-v2" in readme for name in ("setlist", "rig-signal-chain", "on-the-turntable", "the-encore", "backstage-pass", "snake-contributions")),
              "animated build log": "assets/profile-motion.svg" in readme,
              "animated system map": "assets/system-map.svg" in readme,
              "system map cache version": "assets/system-map.svg?v=20261010-pipeline-beam-v2" in readme,
              "animated footer": "assets/profile-footer.svg" in readme,
              "animated guitar section": "assets/guitar-studio.svg" in readme,
              "electric guitar detail": all(token in Path("assets/guitar-studio.svg").read_text(encoding="utf-8") for token in ("six strings", "double-cutaway", "pickup", "tuning")),
              "lazy-loaded below-the-fold images": all((("d2ol7oe51mr4n9.cloudfront.net" in tag) or ('loading="lazy"' in tag.lower())) for tag in re.findall(r"<img[^>]*>", readme, flags=re.I)),
              "removed engineering approach": "## Engineering approach" not in readme,
              "contribution snake": "github-contribution-grid-snake.svg" in readme,
              "streak restored without duplicate activity chart": "streak-stats.demolab.com" in readme and "activity-assets/activity-90d.svg" not in readme,
              "single contribution snake section": readme.count('id="snake-eating-my-contribution-snake"') == 1,
              "original contribution snake palettes": "dist/github-contribution-grid-snake.svg" in Path(".github/workflows/snake.yml").read_text(encoding="utf-8") and "dist/github-contribution-grid-snake-dark.svg?palette=github-dark" in Path(".github/workflows/snake.yml").read_text(encoding="utf-8"),
              "themed GitHub stats card": all(value in readme for value in ("bg_color=0D1117", "title_color=A0A0A0", "text_color=C9C9C9", "icon_color=E5E5E5")),
              "GitHub follow badge URL is valid": "https://img.shields.io/badge/GITHUB-FOLLOW-303030" in readme,
              "profile README stays distinct from the Minecraft portfolio project": not any(phrase in readme.lower() for phrase in ("minecraft-themed profile", "nether-themed profile")),
              "no placeholder copy": not any(text in readme.lower() for text in ("no description yet", "todo:", "lorem ipsum")),
          }
          for name, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {name}")
          assert all(checks.values()), "README content validation failed"

          # Keep the supplied hero banner eager; defer every other README image.
          images = re.findall(r"<img[^>]*>", readme, flags=re.I)
          assert images, "No README images found"
          hero_images = [tag for tag in images if "d2ol7oe51mr4n9.cloudfront.net" in tag]
          assert len(hero_images) == 1, "The exact original banner must appear once"
          for tag in images:
              if "d2ol7oe51mr4n9.cloudfront.net" not in tag:
                  assert 'loading="lazy"' in tag.lower(), f"Image should lazy-load: {tag[:120]}"
          guitar_tag = next((tag for tag in images if "guitar-studio.svg" in tag), "")
          assert "electric guitar" in guitar_tag.lower() and "six strings" in guitar_tag.lower(), "Guitar image alt text should describe the real instrument"

          # Every local asset referenced by the README must exist in the repository.
          refs = re.findall(r'(?:src|href)="(\./assets/[^"]+)"', readme)
          for ref in refs:
              path = Path(ref.split("?", 1)[0])
              assert path.is_file(), f"Missing local asset: {path}"

          # Verify all in-page navigation targets against GitHub's heading slug convention.
          headings = re.findall(r"^#{1,6}\s+(.+?)\s*$", readme, flags=re.M)
          def slugify(value):
              value = re.sub(r"<[^>]+>", "", value)
              value = re.sub(r"[^\x00-\x7F]", "", value).lower()
              value = re.sub(r"[^a-z0-9 -]", "", value)
              return re.sub(r"\s+", "-", value.strip())
          anchors = {slugify(heading) for heading in headings}
          anchors.update(re.findall(r'id="([^"]+)"', readme))
          internal_links = re.findall(r'href="#([^"]+)"', readme)
          for anchor in internal_links:
              assert anchor in anchors, f"Broken internal anchor: #{anchor}"

          # Keep the curated repository links explicit and typo-resistant.
          expected_repositories = (
              "GitGlobe", "nihdhoom", "Saathi", "Satark", "adapt-ai",
              "JYC-Website", "smart_waste_project", "AkashChalak",
              "Smart_bike_taxi_platform", "weather-core-matrix",
          )
          for repository in expected_repositories:
              assert f"https://github.com/kaustubhdua/{repository}" in readme, f"Missing project link: {repository}"

          # Parse SVGs as XML and check accessibility, safe markup and motion fallbacks.
          heading_assets = tuple(sorted(Path("assets/headings").glob("*.svg")))
          assert len(heading_assets) == 7, f"Expected seven custom headings, found {len(heading_assets)}"
          for path in heading_assets:
              ET.parse(path)
              source = path.read_text(encoding="utf-8")
              if path.name == "studio-notes.svg":
                  assert "heading-highlight" in source and "@keyframes revealText" in source, f"Missing animated studio title: {path}"
                  assert "prefers-reduced-motion" in source, f"Missing reduced-motion fallback: {path}"
              else:
                  assert "class=\"heading-highlight\"" in source and "@keyframes revealText" in source, f"Missing animated title highlight: {path}"
                  assert "clip-path=\"url(#heading-reveal)\"" in source, f"Missing clipped text reveal: {path}"
                  assert "prefers-reduced-motion" in source, f"Missing reduced-motion fallback: {path}"
                  assert "width:720px" in source, f"Reduced-motion title should remain fully visible: {path}"
              style = re.search(r"<style>(.*?)</style>", source, flags=re.S)
              assert style and style.group(1).count("{") == style.group(1).count("}"), f"Unbalanced heading CSS: {path}"
          animated_assets = (Path("assets/profile-motion.svg"), Path("assets/profile-footer.svg"), Path("assets/system-map.svg"), Path("assets/guitar-studio.svg"), Path("assets/studio-status.svg"), Path("assets/signal-chain.svg"), Path("assets/vu-meter.svg"), Path("assets/fretboard-progress.svg"), Path("assets/headings/studio-notes.svg"))
          system_map = Path("assets/system-map.svg").read_text(encoding="utf-8")
          assert "<animate" not in system_map.lower(), "System map should use CSS motion so reduced-motion preferences can disable every moving element"
          assert "translateX(660px)" in system_map, "System map particle should traverse all three stages"
          for path in animated_assets:
              ET.parse(path)
              source = path.read_text(encoding="utf-8")
              assert 'role="img"' in source, f"Missing accessible role: {path}"
              assert "aria-labelledby=" in source and "<title" in source and "<desc" in source, f"Missing accessible title/description: {path}"
              assert "prefers-reduced-motion" in source, f"Missing reduced-motion support: {path}"
              assert "<script" not in source.lower(), f"Unexpected script element: {path}"
              style = re.search(r"<style>(.*?)</style>", source, flags=re.S)
              if style:
                  css = style.group(1)
                  assert css.count("{") == css.count("}"), f"Unbalanced CSS: {path}"
                  durations = [float(value) for value in re.findall(r"animation:[^;}]*?(\d+(?:\.\d+)?)s", css) if "infinite" in css]
                  assert all(duration >= 1 for duration in durations), f"Unexpectedly rapid animation: {path}"

          # Validate every local SVG, unique IDs, and internal fragment references.
          svg_files = sorted(Path("assets").rglob("*.svg"))
          for path in svg_files:
              root = ET.parse(path).getroot()
              ids = [node.attrib["id"] for node in root.iter() if "id" in node.attrib]
              assert len(ids) == len(set(ids)), f"Duplicate SVG id in {path}"
              known = set(ids)
              source = path.read_text(encoding="utf-8")
              fragments = re.findall(r'(?:href|xlink:href)="?#([^" )]+)', source)
              for fragment in fragments:
                  assert fragment in known, f"Broken SVG fragment #{fragment} in {path}"
              for fragment in re.findall(r'url\\(#([^\\)]+)\\)', source):
                  assert fragment in known, f"Broken SVG paint/reference #{fragment} in {path}"

          # External image smoke test: permanent HTTP errors fail; transient outages warn.
          import urllib.error
          import urllib.request
          remote_urls = set(re.findall(r'<img[^>]+src="(https?://[^"]+)"', readme, flags=re.I))
          remote_urls.update(re.findall(r'<source[^>]+srcset="(https?://[^"]+)"', readme, flags=re.I))
          failures, warnings = [], []
          for url in sorted(remote_urls):
              request = urllib.request.Request(url, headers={"User-Agent": "profile-readme-qa/1.0"})
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      content_type = response.headers.get("Content-Type", "").lower()
                      if response.status >= 400:
                          failures.append(f"{response.status} {url}")
                      elif "image/" not in content_type and "svg" not in content_type:
                          warnings.append(f"unexpected content type {content_type!r}: {url}")
              except urllib.error.HTTPError as exc:
                  if exc.code in (429, 500, 502, 503, 504):
                      warnings.append(f"temporary HTTP {exc.code}: {url}")
                  else:
                      failures.append(f"HTTP {exc.code}: {url}")
              except Exception as exc:
                  warnings.append(f"unreachable during smoke test ({exc}): {url}")
          for item in warnings:
              print("WARN: external image check:", item)
          for item in failures:
              print("FAIL: external image check:", item)
          assert not failures, "One or more external image URLs returned a permanent HTTP error"
          print(f"PASS: {len(refs)} local asset references, {len(internal_links)} internal anchors, {len(expected_repositories)} curated repository links, {len(svg_files)} SVG files, and {len(remote_urls)} remote image URLs checked.")
          PY
