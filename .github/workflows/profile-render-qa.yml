name: Profile rendered browser QA

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/**"
      - ".github/workflows/profile-render-qa.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - ".github/workflows/profile-render-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Render GitHub profile in desktop and mobile themes
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              { theme: "light", width: 1440, height: 1000 },
              { theme: "dark", width: 1440, height: 1000 },
              { theme: "light", width: 390, height: 844 },
              { theme: "dark", width: 390, height: 844 },
            ];
            const results = [];

            for (const test of cases) {
              const mobile = test.width < 600;
              const context = await browser.newContext({
                viewport: { width: test.width, height: test.height },
                colorScheme: test.theme,
                deviceScaleFactor: 1,
                isMobile: mobile,
                hasTouch: mobile,
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on("pageerror", error => pageErrors.push(error.message));

              const response = await page.goto("https://github.com/kaustubhdua", {
                waitUntil: "domcontentloaded",
                timeout: 60000,
              });
              if (!response || response.status() >= 400) {
                throw new Error(`Profile returned HTTP ${response?.status() ?? "no response"} for ${test.theme}/${test.width}`);
              }

              const readme = page.locator(".markdown-body").first();
              await readme.waitFor({ state: "visible", timeout: 45000 });
              await readme.evaluate(root => {
                for (const img of root.querySelectorAll("img")) img.loading = "eager";
              });
              await readme.locator("img").evaluateAll(images =>
                Promise.all(images.map(img => img.decode().catch(() => null)))
              );

              const state = await page.evaluate(() => {
                const root = document.querySelector(".markdown-body");
                const images = [...root.querySelectorAll("img")];
                const brokenLocalImages = images
                  .filter(img => (img.currentSrc || img.src).includes("/assets/"))
                  .filter(img => !img.complete || img.naturalWidth === 0)
                  .map(img => img.currentSrc || img.src);
                const links = [...root.querySelectorAll("a")].map(a => a.href);
                return {
                  title: document.title,
                  viewportWidth: window.innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  markdownWidth: Math.round(root.getBoundingClientRect().width),
                  imageCount: images.length,
                  brokenLocalImages,
                  hasFeaturedProjects: root.innerText.includes("FEATURED BUILDS / SIX PROJECTS"),
                  projectArtworkWidths: [...root.querySelectorAll('img[src*="/assets/projects/"]')].map(img => Math.round(img.getBoundingClientRect().width)),
                  projectGalleryRows: (() => {
                    const image = root.querySelector('img[src*="/assets/projects/gitglobe.svg"]');
                    const table = image?.closest("table");
                    return table ? [...table.querySelectorAll("tr")].map(row => row.querySelectorAll("td").length) : [];
                  })(),
                  hasIrisSection: root.innerText.includes("ON REPEAT / IRIS"),
                  hasSpotifyLink: links.some(url => url.startsWith("https://open.spotify.com/track/")),
                  hasYouTubeLink: links.some(url => url.includes("youtube.com/results?search_query=Goo+Goo+Dolls+Iris")),
                  prefersDark: matchMedia("(prefers-color-scheme: dark)").matches,
                };
              });

              if (!state.hasFeaturedProjects || !state.hasIrisSection || !state.hasSpotifyLink || !state.hasYouTubeLink) {
                throw new Error(`Required profile content missing in ${test.theme}/${test.width}: ${JSON.stringify(state)}`);
              }
              if (JSON.stringify(state.projectGalleryRows) !== JSON.stringify([2, 2, 2])) {
                throw new Error(`Featured project gallery is not a two-column grid in ${test.theme}/${test.width}: ${JSON.stringify(state.projectGalleryRows)}`);
              }
              if (mobile && state.projectArtworkWidths.some(width => width < 120)) {
                throw new Error(`Featured artwork is too narrow on mobile in ${test.theme}: ${JSON.stringify(state.projectArtworkWidths)}`);
              }
              if (state.prefersDark !== (test.theme === "dark")) {
                throw new Error(`Browser theme emulation failed for ${test.theme}/${test.width}`);
              }
              if (state.documentWidth > test.width + 2) {
                throw new Error(`Horizontal page overflow in ${test.theme}/${test.width}: ${state.documentWidth}px document for ${test.width}px viewport`);
              }
              if (state.brokenLocalImages.length) {
                throw new Error(`Broken local README artwork in ${test.theme}/${test.width}: ${state.brokenLocalImages.join(", ")}`);
              }
              if (pageErrors.length) {
                throw new Error(`Browser runtime errors in ${test.theme}/${test.width}: ${pageErrors.join("; ")}`);
              }

              const filename = `artifacts/profile-${test.theme}-${test.width}.png`;
              await page.screenshot({ path: filename, fullPage: true, animations: "disabled" });
              results.push({ ...test, ...state, pageErrors, screenshot: filename });
              await context.close();
            }

            await browser.close();
            console.log(JSON.stringify(results, null, 2));
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload rendered profile screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: profile-rendered-desktop-mobile-light-dark
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
