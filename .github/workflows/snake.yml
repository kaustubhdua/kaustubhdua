name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: kaustubhdua
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23A0A0A0&color_dots=%23161616%2C%23303030%2C%23777777%2C%23AAAAAA%2C%23E5E5E5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A0A0A0&color_dots=%23161616%2C%23303030%2C%23777777%2C%23AAAAAA%2C%23E5E5E5
      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
