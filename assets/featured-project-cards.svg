<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="254" viewBox="0 0 1200 254" role="img" aria-labelledby="title desc">
<title id="title">Selected builds — three project cards</title>
<desc id="desc">Three monochrome project-card illustrations: a spatial repository constellation for GitGlobe, agricultural field-routing lines for NIRDHOOM, and a voice waveform with source markers for Saathi. These are visual summaries, not live product screenshots.</desc>
<defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b1b1b"/><stop offset="1" stop-color="#080808"/></linearGradient></defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1px}.title{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-weight:750;letter-spacing:1px}.orbit{transform-origin:195px 105px;animation:spin 26s linear infinite}.field{stroke-dasharray:6 8;animation:dash 13s linear infinite}.voice{stroke-dasharray:3 8;animation:dash 9s linear infinite}.pulse{animation:pulse 3.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-160}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.orbit,.field,.voice,.pulse{animation:none!important}}
</style>
<g><rect x="1" y="1" width="386" height="252" rx="12" fill="url(#card)" stroke="#555"/><text class="m" x="24" y="29" fill="#888" font-size="9">01 / SPATIAL DISCOVERY</text><g class="orbit" fill="none" stroke="#ddd"><circle cx="195" cy="105" r="63" stroke-opacity=".35"/><circle cx="195" cy="105" r="43" stroke-opacity=".3" stroke-dasharray="2 7"/><ellipse cx="195" cy="105" rx="87" ry="27" transform="rotate(-24 195 105)" stroke-opacity=".6"/><path d="M112 105H278M195 22V188" stroke-opacity=".18"/><circle cx="195" cy="42" r="4" fill="#eee"/><circle cx="250" cy="78" r="3" fill="#eee"/><circle cx="145" cy="141" r="3" fill="#eee"/></g><circle class="pulse" cx="195" cy="105" r="7" fill="#eee"/><text class="title" x="24" y="216" fill="#f2f2f2" font-size="18">GITGLOBE</text><text class="m" x="24" y="236" fill="#888" font-size="9">REPOSITORIES / CAPABILITIES / MAP</text></g>
<g transform="translate(407 0)"><rect x="1" y="1" width="386" height="252" rx="12" fill="url(#card)" stroke="#555"/><text class="m" x="24" y="29" fill="#888" font-size="9">02 / FIELD COORDINATION</text><g fill="none" stroke="#aaa" stroke-opacity=".55"><path class="field" d="M38 68Q100 38 174 65T350 65M38 94Q100 64 174 91T350 91M38 120Q100 90 174 117T350 117M38 146Q100 116 174 143T350 143M38 172Q100 142 174 169T350 169" /><path d="M65 55L95 185M145 55L175 185M225 55L255 185M305 55L335 185" stroke-opacity=".22"/></g><path d="M72 156L147 91L235 128L311 76" fill="none" stroke="#eee" stroke-width="1.6"/><g fill="#eee"><circle cx="72" cy="156" r="4"/><circle cx="147" cy="91" r="4"/><circle cx="235" cy="128" r="4"/><circle cx="311" cy="76" r="4"/></g><text class="title" x="24" y="216" fill="#f2f2f2" font-size="18">NIRDHOOM</text><text class="m" x="24" y="236" fill="#888" font-size="9">FARMS / SERVICES / ROUTING</text></g>
<g transform="translate(813 0)"><rect x="1" y="1" width="386" height="252" rx="12" fill="url(#card)" stroke="#555"/><text class="m" x="24" y="29" fill="#888" font-size="9">03 / VOICE-FIRST ASSISTANCE</text><g fill="none" stroke="#ddd" stroke-width="1.4"><path class="voice" d="M35 112H67L78 92L91 137L105 72L119 155L133 90L147 130L161 103L175 112H210L222 112L233 86L245 140L257 112H350"/><path d="M52 62H348M52 162H348" stroke-opacity=".2" stroke-dasharray="2 7"/></g><g fill="#eee"><circle class="pulse" cx="78" cy="92" r="3"/><circle class="pulse" cx="245" cy="140" r="3"/></g><text class="title" x="24" y="216" fill="#f2f2f2" font-size="18">SAATHI</text><text class="m" x="24" y="236" fill="#888" font-size="9">LANGUAGE / SOURCES / CONSENT</text></g>
</svg>