<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">The engineering fretboard</title>
<desc id="desc">A detailed six-string electric guitar fretboard with steel strings, frets, position inlays and six independently travelling monochrome note markers representing design, build, data, test, document and ship. Decorative metaphor, not progress telemetry.</desc>
<defs><linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#252525"/><stop offset=".5" stop-color="#101010"/><stop offset="1" stop-color="#202020"/></linearGradient><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#555"/><stop offset=".5" stop-color="#eee"/><stop offset="1" stop-color="#666"/></linearGradient><pattern id="grain" width="80" height="24" patternUnits="userSpaceOnUse"><path d="M0 7Q20 1 40 7T80 7M0 19Q20 13 40 19T80 19" fill="none" stroke="#aaa" stroke-opacity=".06"/></pattern></defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.5px}.fret{stroke:url(#metal);stroke-width:2}.string{stroke:#ddd;stroke-opacity:.8}.string:nth-child(2){stroke-width:1.8}.string:nth-child(3){stroke-width:1.5}.string:nth-child(4){stroke-width:1.25}.string:nth-child(5){stroke-width:1}.string:nth-child(6){stroke-width:.8}
.note{fill:#f4efe5;filter:drop-shadow(0 0 4px #fff);animation:slide 10s ease-in-out infinite}.n2{animation-delay:-1.6s}.n3{animation-delay:-3.2s}.n4{animation-delay:-4.8s}.n5{animation-delay:-6.4s}.n6{animation-delay:-8s}
@keyframes slide{0%,100%{transform:translateX(0);opacity:.4}50%{transform:translateX(640px);opacity:1}}
@media(prefers-reduced-motion:reduce){.note{animation:none!important;opacity:.85}}
</style>
<rect x="1" y="1" width="1198" height="298" rx="12" fill="#0b0b0b" stroke="#555"/>
<text class="m" x="28" y="30" fill="#eee" font-size="11">THE ENGINEERING FRETBOARD</text><text class="m" x="1172" y="30" fill="#777" font-size="9" text-anchor="end">SIX STRINGS / ONE PRACTICE</text>
<rect x="24" y="49" width="1152" height="190" rx="7" fill="url(#wood)" stroke="#555"/><rect x="24" y="49" width="1152" height="190" rx="7" fill="url(#grain)"/>
<g class="fret"><path d="M170 50V238M280 50V238M390 50V238M500 50V238M610 50V238M720 50V238M830 50V238M940 50V238M1050 50V238"/></g>
<g fill="#999" opacity=".55"><circle cx="225" cy="144" r="4"/><circle cx="335" cy="144" r="4"/><circle cx="555" cy="144" r="4"/><circle cx="775" cy="144" r="4"/><circle cx="995" cy="144" r="4"/><circle cx="885" cy="100" r="3"/><circle cx="885" cy="188" r="3"/></g>
<g fill="none" stroke-linecap="round"><path class="string" d="M40 78H1160M40 108H1160M40 138H1160M40 168H1160M40 198H1160M40 228H1160"/></g>
<g><circle class="note" cx="90" cy="78" r="5"/><circle class="note n2" cx="90" cy="108" r="5"/><circle class="note n3" cx="90" cy="138" r="5"/><circle class="note n4" cx="90" cy="168" r="5"/><circle class="note n5" cx="90" cy="198" r="5"/><circle class="note n6" cx="90" cy="228" r="5"/></g>
<g class="m" fill="#c9c9c9" font-size="10"><text x="28" y="263">01 DESIGN</text><text x="220" y="263">02 BUILD</text><text x="410" y="263">03 DATA</text><text x="600" y="263">04 TEST</text><text x="790" y="263">05 DOCUMENT</text><text x="1010" y="263">06 SHIP</text></g>
<path d="M28 276H1172" stroke="#555"/><text class="m" x="28" y="290" fill="#666" font-size="8">A VISUAL METAPHOR FOR THE WORKFLOW — NOT A LIVE COMPLETION METER</text>
</svg>