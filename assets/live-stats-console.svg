<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="title desc">
<title id="title">The profile statistics console</title><desc id="desc">A monochrome studio-console frame introducing GitHub overview, language distribution and contribution streak cards below. Self-hosted cards refresh daily or weekly; the external streak card is provided by its own service.</desc>
<style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px}.pulse{animation:pulse 2.8s ease-in-out infinite}.wave{stroke-dasharray:3 8;animation:flow 10s linear infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-132}}@media(prefers-reduced-motion:reduce){.pulse,.wave{animation:none!important}}</style>
<rect x="1" y="1" width="1198" height="98" rx="10" fill="#101010" stroke="#555"/><path d="M24 26H1176" stroke="#555"/><circle class="pulse" cx="34" cy="48" r="3" fill="#eee"/><text class="m" x="52" y="52" fill="#eee" font-size="13">PROFILE STATISTICS CONSOLE</text><text class="m" x="1176" y="52" fill="#888" text-anchor="end" font-size="9">ACTIVITY / LANGUAGE MIX / STREAK</text><path class="wave" d="M24 75H310L322 75L334 62L346 86L358 70L370 75H830L842 75L854 66L866 82L878 75H1176" fill="none" stroke="#bbb" stroke-width="1.4"/><text class="m" x="24" y="91" fill="#666" font-size="7">SELF-HOSTED CARDS REFRESH DAILY OR WEEKLY · EXTERNAL STREAK SERVICE MAY VARY</text>
</svg>