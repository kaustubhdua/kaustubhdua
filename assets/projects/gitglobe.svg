<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">GitGlobe — repository constellation</title><desc id="desc">Monochrome orbiting repository nodes connected around a central discovery point. Decorative project artwork.</desc><style>.m{font-family:ui-monospace,monospace;letter-spacing:2px}.orbit{transform-origin:380px 142px;animation:spin 32s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none!important}}</style><rect x="1" y="1" width="758" height="298" rx="12" fill="#101010" stroke="#555"/><text class="m" x="28" y="34" fill="#888" font-size="11">01 / SPATIAL REPOSITORY DISCOVERY</text><g class="orbit" fill="none" stroke="#aaa"><ellipse cx="380" cy="145" rx="230" ry="62" transform="rotate(-22 380 145)"/><ellipse cx="380" cy="145" rx="180" ry="104" transform="rotate(35 380 145)" stroke-opacity=".5"/><circle cx="380" cy="145" r="115" stroke-dasharray="3 10" stroke-opacity=".5"/><path d="M150 145H610M380 52V238" stroke-opacity=".2"/><circle cx="160" cy="83" r="7" fill="#eee"/><circle cx="584" cy="92" r="5" fill="#eee"/><circle cx="276" cy="237" r="6" fill="#eee"/><circle cx="475" cy="218" r="4" fill="#eee"/></g><circle class="pulse" cx="380" cy="145" r="19" fill="#eee"/><circle cx="380" cy="145" r="34" fill="none" stroke="#ddd" stroke-opacity=".6"/><text class="m" x="28" y="260" fill="#f1f1f1" font-size="22">GITGLOBE</text><text class="m" x="28" y="281" fill="#777" font-size="10">CAPABILITY MAP / OPEN-SOURCE DISCOVERY</text></svg>