<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">NIRDHOOM — connected field routes</title><desc id="desc">Monochrome agricultural field rows with a route linking collection and service points. Decorative project artwork.</desc><style>.m{font-family:ui-monospace,monospace;letter-spacing:2px}.rows{stroke-dasharray:8 9;animation:flow 16s linear infinite}.route{stroke-dasharray:7 9;animation:flow 8s linear infinite}@keyframes flow{to{stroke-dashoffset:-170}}@media(prefers-reduced-motion:reduce){.rows,.route{animation:none!important}}</style><rect x="1" y="1" width="758" height="298" rx="12" fill="#101010" stroke="#555"/><text class="m" x="28" y="34" fill="#888" font-size="11">02 / FIELD-TO-SERVICE COORDINATION</text><g fill="none" stroke="#888" stroke-opacity=".55"><path class="rows" d="M42 82Q170 35 285 82T510 82T720 82M42 111Q170 64 285 111T510 111T720 111M42 140Q170 93 285 140T510 140T720 140M42 169Q170 122 285 169T510 169T720 169M42 198Q170 151 285 198T510 198T720 198M42 227Q170 180 285 227T510 227T720 227"/><path d="M90 66L124 242M230 66L264 242M370 66L404 242M510 66L544 242M650 66L684 242" stroke-opacity=".2"/></g><path class="route" d="M105 207L220 105L385 171L545 91L662 158" fill="none" stroke="#eee" stroke-width="2"/><g fill="#eee"><circle cx="105" cy="207" r="6"/><circle cx="220" cy="105" r="6"/><circle cx="385" cy="171" r="6"/><circle cx="545" cy="91" r="6"/><circle cx="662" cy="158" r="6"/></g><text class="m" x="28" y="260" fill="#f1f1f1" font-size="22">NIRDHOOM</text><text class="m" x="28" y="281" fill="#777" font-size="10">FARMS / SERVICES / COLLECTION / ROUTING</text></svg>