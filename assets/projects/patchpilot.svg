<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">PatchPilot — evidence-led code review</title><desc id="desc">A monochrome diff sheet with measured review signals, highlighted evidence and test checkpoints. Decorative project artwork.</desc><style>.m{font-family:ui-monospace,monospace;letter-spacing:2px}.scan{animation:scan 5s ease-in-out infinite}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(112px);opacity:.8}}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.scan,.pulse{animation:none!important}}</style><rect x="1" y="1" width="758" height="298" rx="12" fill="#101010" stroke="#555"/><text class="m" x="28" y="34" fill="#888" font-size="11">04 / EXPLAINABLE PULL REQUEST TRIAGE</text><rect x="44" y="63" width="410" height="156" rx="8" fill="#171717" stroke="#555"/><g stroke="#444"><path d="M44 96H454M44 128H454M44 160H454M44 192H454"/></g><g class="m" font-size="12"><text x="62" y="86" fill="#777">DIFF / FILE 01</text><text x="62" y="118" fill="#aaa">− validate_input(raw)</text><text x="62" y="150" fill="#ddd">+ validate_bounded(raw)</text><text x="62" y="182" fill="#888">  evidence: line 42–48</text></g><rect class="scan" x="44" y="63" width="410" height="2" fill="#eee"/><g fill="none" stroke="#aaa"><path d="M500 82H704M500 121H664M500 160H704M500 199H630" stroke-width="2"/><circle class="pulse" cx="500" cy="82" r="6" fill="#eee"/><circle class="pulse" cx="500" cy="121" r="6" fill="#eee"/><circle class="pulse" cx="500" cy="160" r="6" fill="#eee"/><circle class="pulse" cx="500" cy="199" r="6" fill="#eee"/></g><g class="m" fill="#888" font-size="10"><text x="515" y="74">SIGNAL</text><text x="515" y="113">EVIDENCE</text><text x="515" y="152">RISK</text><text x="515" y="191">TEST</text></g><text class="m" x="28" y="260" fill="#f1f1f1" font-size="22">PATCHPILOT</text><text class="m" x="28" y="281" fill="#777" font-size="10">EARLY MVP / REVIEW ASSISTANCE, NOT A SECURITY VERDICT</text></svg>