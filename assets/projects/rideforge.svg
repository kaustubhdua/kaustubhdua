<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">RideForge — dispatch and route intelligence</title><desc id="desc">A monochrome city grid with a shortest-path route, pickup markers and a driver dispatch signal. Decorative project artwork.</desc><style>.m{font-family:ui-monospace,monospace;letter-spacing:2px}.route{stroke-dasharray:7 9;animation:flow 9s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-180}}@keyframes pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.route,.pulse{animation:none!important}}</style><rect x="1" y="1" width="758" height="298" rx="12" fill="#101010" stroke="#555"/><text class="m" x="28" y="34" fill="#888" font-size="11">05 / REAL API · PERSISTED DISPATCH</text><g stroke="#555" stroke-opacity=".65" fill="none"><path d="M54 72H710M54 112H710M54 152H710M54 192H710M54 232H710M104 58V244M184 58V244M264 58V244M344 58V244M424 58V244M504 58V244M584 58V244M664 58V244"/></g><path class="route" d="M104 192L184 112L264 112L344 192L424 152L504 72L584 112L664 192" fill="none" stroke="#eee" stroke-width="3"/><g fill="#eee"><circle cx="104" cy="192" r="7"/><circle cx="264" cy="112" r="5"/><circle cx="424" cy="152" r="5"/><circle cx="664" cy="192" r="7"/></g><circle class="pulse" cx="504" cy="72" r="13" fill="none" stroke="#eee" stroke-width="2"/><text class="m" x="28" y="260" fill="#f1f1f1" font-size="22">RIDEFORGE</text><text class="m" x="28" y="281" fill="#777" font-size="10">C++17 / POSTGRESQL / ROUTING / DISPATCH WORKFLOWS</text></svg>