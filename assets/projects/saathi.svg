<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Saathi — voice and source signal</title><desc id="desc">A monochrome voice waveform passes through source markers and a consent checkpoint. Decorative project artwork.</desc><style>.m{font-family:ui-monospace,monospace;letter-spacing:2px}.wave{stroke-dasharray:4 10;animation:flow 12s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-200}}@keyframes pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.wave,.pulse{animation:none!important}}</style><rect x="1" y="1" width="758" height="298" rx="12" fill="#101010" stroke="#555"/><text class="m" x="28" y="34" fill="#888" font-size="11">03 / VOICE-FIRST, SOURCE-AWARE ASSISTANCE</text><path d="M42 145H718" stroke="#555" stroke-dasharray="2 8"/><path class="wave" d="M42 145H100L118 108L136 183L154 80L172 210L190 112L208 162L226 132H315L330 145L345 92L360 196L375 116L390 145H490L505 145L520 105L535 180L550 145H718" fill="none" stroke="#eee" stroke-width="2"/><g fill="#eee"><circle class="pulse" cx="154" cy="80" r="6"/><circle class="pulse" cx="360" cy="196" r="6"/><circle class="pulse" cx="535" cy="180" r="6"/></g><g class="m" fill="#888" font-size="10"><text x="105" y="236">VOICE</text><text x="320" y="236">SOURCE CHECK</text><text x="540" y="236">CONSENT</text></g><text class="m" x="28" y="260" fill="#f1f1f1" font-size="22">SAATHI</text><text class="m" x="28" y="281" fill="#777" font-size="10">LANGUAGE / PROVENANCE / HUMAN ESCALATION</text></svg>