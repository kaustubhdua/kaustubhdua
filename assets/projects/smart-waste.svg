<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Smart Waste Collection — observe to optimise</title><desc id="desc">A monochrome collection operations schematic connecting sensor readings, priority scoring, vehicle capacity and an optimised route. Decorative project artwork; no live sensor data.</desc><style>.m{font-family:ui-monospace,monospace;letter-spacing:2px}.flow{stroke-dasharray:6 9;animation:flow 10s linear infinite}.pulse{animation:pulse 2.7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-170}}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none!important}}</style><rect x="1" y="1" width="758" height="298" rx="12" fill="#101010" stroke="#555"/><text class="m" x="28" y="34" fill="#888" font-size="11">06 / WASTE OPERATIONS ENGINEERING PROTOTYPE</text><g fill="#171717" stroke="#777"><rect x="38" y="88" width="148" height="92" rx="8"/><rect x="222" y="88" width="148" height="92" rx="8"/><rect x="406" y="88" width="148" height="92" rx="8"/><rect x="590" y="88" width="132" height="92" rx="8"/></g><g class="m" fill="#ddd" font-size="12" text-anchor="middle"><text x="112" y="124">SENSOR</text><text x="112" y="145" fill="#888" font-size="9">TELEMETRY</text><text x="296" y="124">PRIORITY</text><text x="296" y="145" fill="#888" font-size="9">SCORING</text><text x="480" y="124">CAPACITY</text><text x="480" y="145" fill="#888" font-size="9">CONSTRAINTS</text><text x="656" y="124">ROUTE</text><text x="656" y="145" fill="#888" font-size="9">OPTIMISATION</text></g><path class="flow" d="M186 134H222M370 134H406M554 134H590" fill="none" stroke="#eee" stroke-width="2"/><g fill="#eee"><circle class="pulse" cx="186" cy="134" r="4"/><circle class="pulse" cx="370" cy="134" r="4"/><circle class="pulse" cx="554" cy="134" r="4"/></g><text class="m" x="28" y="260" fill="#f1f1f1" font-size="22">SMART WASTE</text><text class="m" x="28" y="281" fill="#777" font-size="10">SYNTHETIC DEMO DATA / NOT A VERIFIED MUNICIPAL DEPLOYMENT</text></svg>